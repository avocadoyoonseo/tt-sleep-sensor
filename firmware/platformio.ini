; PlatformIO project configuration for TT Sleep Sensor (ESP32)
; Upload: click the → button in the PlatformIO toolbar, or run:
;   pio run --target upload

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
src_dir   = .

monitor_speed  = 115200
upload_speed   = 921600

lib_deps =
    tzapu/WiFiManager @ ^0.16.0
    sensirion/Sensirion I2C SCD4x @ ^0.4.0
    claws/BH1750 @ ^1.3.0
    adafruit/RTClib @ ^2.1.4
    adafruit/Adafruit BusIO @ ^1.16.1
    olikraus/U8g2 @ ^2.35.9
